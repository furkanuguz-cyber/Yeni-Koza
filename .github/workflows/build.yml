name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Projeyi ZIP'ten çıkar
        run: |
          unzip -q YeniKoza-main.zip
          echo "ZIP içeriği:"
          find . -maxdepth 3 -type f | head -100

      - name: Android projesini bul
        id: project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Gradle ile APK oluştur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: YeniKoza-APK
          path: |
            **/build/outputs/apk/debug/*.apk
